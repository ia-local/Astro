<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="images/logo.png">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="images/logo.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="AstroHub">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Journal &amp; Partages — Messages, Musique, Vidéos | AstroHub</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .subtitle-muted {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-top: -6px;
            margin-bottom: 20px;
        }

        .filter-bar {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 22px;
            padding: 10px;
            background: var(--bg-card);
            border-radius: var(--border-radius);
        }

        .filter-btn {
            padding: 8px 13px;
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-light);
            border: 1px solid transparent;
            border-radius: 8px;
            font-size: 0.86rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
        }

        .filter-btn:hover {
            background: rgba(78, 168, 222, 0.15);
            border-color: var(--text-muted);
        }

        .filter-btn.active {
            background: var(--text-muted);
            color: var(--bg-dark);
            box-shadow: 0 0 10px rgba(78, 168, 222, 0.35);
        }

        .post-meta-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }

        .cat-badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 999px;
            font-size: 0.76rem;
            font-weight: 700;
        }

        .cat-message { background: rgba(255, 77, 109, 0.18); color: #ff758f; }
        .cat-musique { background: rgba(78, 168, 222, 0.18); color: #72efdd; }
        .cat-video { background: rgba(238, 155, 0, 0.18); color: #ffd166; }
        .cat-explication { background: rgba(82, 183, 136, 0.18); color: #80ed99; }

        .post-date {
            font-size: 0.8rem;
            color: rgba(244, 246, 249, 0.55);
        }

        .post-body {
            line-height: 1.65;
            color: rgba(244, 246, 249, 0.92);
            white-space: pre-line;
            margin: 8px 0 0 0;
        }

        .media-embed-box {
            margin-top: 14px;
            border-radius: 10px;
            overflow: hidden;
            background: rgba(10, 14, 23, 0.8);
            border: 1px solid rgba(78, 168, 222, 0.22);
        }

        .audio-player-box {
            padding: 12px 14px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .audio-track-label {
            font-size: 0.82rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        .media-embed-box audio,
        .media-embed-box video {
            width: 100%;
            display: block;
        }

        .media-embed-box img {
            width: 100%;
            height: auto;
            display: block;
        }

        .youtube-wrapper {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
        }

        .youtube-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        .external-media-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 12px;
            padding: 8px 14px;
            background: rgba(78, 168, 222, 0.14);
            color: var(--text-muted);
            text-decoration: none;
            border-radius: 8px;
            font-size: 0.88rem;
            font-weight: 600;
            border: 1px solid rgba(78, 168, 222, 0.3);
            transition: var(--transition);
        }

        .external-media-link:hover {
            background: rgba(78, 168, 222, 0.25);
        }
    </style>
</head>
<body>

    <main class="app-container">
        <div style="margin-bottom: 15px;">
            <a href="index.html" class="calendar-day-link" style="display: inline-block; text-align: center;">← Retour au Hub</a>
        </div>

        <header class="app-header">
            <h1 id="main-title">Journal &amp; Partages</h1>
            <p class="subtitle-muted">Messages, Musique, Vidéos &amp; Explications</p>
        </header>

        <!-- Filtres par rubrique -->
        <nav class="filter-bar" aria-label="Filtrer les entrées du journal">
            <button type="button" class="filter-btn active" data-filter="all">Tout</button>
            <button type="button" class="filter-btn" data-filter="message">💌 Messages</button>
            <button type="button" class="filter-btn" data-filter="musique">🎵 Musique</button>
            <button type="button" class="filter-btn" data-filter="video">🎬 Vidéos</button>
            <button type="button" class="filter-btn" data-filter="explication">📖 Explications</button>
        </nav>

        <!-- Flux chronologique alimenté par data-divers.json -->
        <section id="posts-feed" class="horoscope-grid" aria-live="polite">
            <article class="card">
                <p style="text-align: center; color: var(--text-muted);">Chargement du journal...</p>
            </article>
        </section>

        <footer class="app-footer">
            <p>AstroHub — Journal partagé • Mickael &amp; Sandra</p>
        </footer>
    </main>

    <script>
        const CATEGORY_META = {
            message: { label: "💌 Message", badgeClass: "cat-message", cardClass: "love" },
            musique: { label: "🎵 Musique", badgeClass: "cat-musique", cardClass: "projects" },
            video: { label: "🎬 Vidéo", badgeClass: "cat-video", cardClass: "activities" },
            explication: { label: "📖 Explication", badgeClass: "cat-explication", cardClass: "projects" }
        };

        let allPosts = [];
        let activeFilter = "all";

        function extractYouTubeId(url) {
            if (!url) return null;
            const match = url.match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([a-zA-Z0-9_-]{11})/);
            return match ? match[1] : null;
        }

        function escapeHTML(str) {
            const div = document.createElement("div");
            div.textContent = str;
            return div.innerHTML;
        }

        function buildMediaHTML(post) {
            const url = (post.mediaUrl || "").trim();
            if (!url) return "";

            const ytId = extractYouTubeId(url);
            if (ytId) {
                return `
                    <div class="media-embed-box">
                        <div class="youtube-wrapper">
                            <iframe src="https://www.youtube-nocookie.com/embed/${ytId}" title="${escapeHTML(post.title)}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
                        </div>
                    </div>
                `;
            }

            if (/\.(mp3|wav|ogg|m4a|flac)(\?.*)?$/i.test(url)) {
                const trackName = post.trackLabel || url.split("/").pop();
                return `
                    <div class="media-embed-box audio-player-box">
                        <span class="audio-track-label">🎧 ${escapeHTML(trackName)}</span>
                        <audio controls preload="metadata" src="${escapeHTML(url)}">
                            Votre navigateur ne supporte pas la lecture audio.
                        </audio>
                    </div>
                `;
            }

            if (/\.(mp4|webm|mov)(\?.*)?$/i.test(url)) {
                return `
                    <div class="media-embed-box">
                        <video controls preload="metadata" src="${escapeHTML(url)}"></video>
                    </div>
                `;
            }

            if (/\.(jpg|jpeg|png|webp|gif)(\?.*)?$/i.test(url)) {
                return `
                    <div class="media-embed-box">
                        <img src="${escapeHTML(url)}" alt="${escapeHTML(post.title)}">
                    </div>
                `;
            }

            return `<a href="${escapeHTML(url)}" target="_blank" rel="noopener noreferrer" class="external-media-link">🔗 Écouter / Voir le lien ↗</a>`;
        }

        function formatFrenchDate(dateStr) {
            if (!dateStr) return "";
            const d = new Date(`${dateStr}T12:00:00`);
            if (isNaN(d.getTime())) return dateStr;
            const formatted = d.toLocaleDateString("fr-FR", {
                weekday: "long",
                day: "numeric",
                month: "long",
                year: "numeric"
            });
            return formatted.charAt(0).toUpperCase() + formatted.slice(1);
        }

        function renderPosts() {
            const feed = document.getElementById("posts-feed");
            const filtered = activeFilter === "all"
                ? allPosts
                : allPosts.filter(p => p.category === activeFilter);

            if (filtered.length === 0) {
                feed.innerHTML = `<article class="card"><p style="text-align:center; color:rgba(244,246,249,0.6);">Aucune entrée dans cette rubrique pour le moment.</p></article>`;
                return;
            }

            feed.innerHTML = filtered.map(post => {
                const meta = CATEGORY_META[post.category] || CATEGORY_META.message;
                const dateStr = formatFrenchDate(post.date);
                const authorStr = post.author ? `${escapeHTML(post.author)} • ` : "";

                return `
                    <article class="card ${meta.cardClass}">
                        <div class="post-meta-top">
                            <span class="cat-badge ${meta.badgeClass}">${meta.label}</span>
                            <span class="post-date">${authorStr}${dateStr}</span>
                        </div>
                        <h3>${escapeHTML(post.title)}</h3>
                        <p class="post-body">${escapeHTML(post.content)}</p>
                        ${buildMediaHTML(post)}
                    </article>
                `;
            }).join("");
        }

        document.addEventListener("DOMContentLoaded", async () => {
            document.querySelectorAll(".filter-btn").forEach(btn => {
                btn.addEventListener("click", () => {
                    document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
                    btn.classList.add("active");
                    activeFilter = btn.dataset.filter;
                    renderPosts();
                });
            });

            try {
                const response = await fetch("./data-divers.json");
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await response.json();
                allPosts = Array.isArray(data.posts) ? data.posts : [];
                renderPosts();
            } catch (error) {
                console.error("Erreur lors du chargement de data-divers.json :", error);
                document.getElementById("posts-feed").innerHTML = `
                    <article class="card">
                        <p style="text-align:center; color:var(--love-color);">Impossible de charger <code>data-divers.json</code>.</p>
                    </article>
                `;
            }
        });
    </script>
</body>
</html>
