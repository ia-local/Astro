<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="images/logo.png">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="images/logo.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="AstroHub">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Divers &amp; Partages — Messages, Musique, Vidéos | AstroHub</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .top-nav-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 15px;
        }

        .subtitle-muted {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-top: -6px;
            margin-bottom: 20px;
        }

        /* Barre de filtres */
        .filter-bar {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 20px;
            padding: 10px;
            background: var(--bg-card);
            border-radius: var(--border-radius);
        }

        .filter-btn {
            padding: 8px 13px;
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-light);
            border: 1px solid transparent;
            border-radius: 8px;
            font-size: 0.86rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
        }

        .filter-btn:hover {
            background: rgba(78, 168, 222, 0.15);
            border-color: var(--text-muted);
        }

        .filter-btn.active {
            background: var(--text-muted);
            color: var(--bg-dark);
            box-shadow: 0 0 10px rgba(78, 168, 222, 0.35);
        }

        /* Formulaire de création */
        .composer-card {
            background: linear-gradient(135deg, #141b2d, #1c263b);
            border-left: 5px solid var(--activity-color);
            border-radius: var(--border-radius);
            padding: 18px;
            margin-bottom: 24px;
        }

        .composer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            user-select: none;
        }

        .composer-header h3 {
            margin: 0;
            font-size: 1.1rem;
            color: var(--activity-color);
        }

        .composer-form {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 15px;
        }

        .composer-form.hidden {
            display: none;
        }

        .form-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .field-input,
        .field-select,
        .field-textarea {
            width: 100%;
            box-sizing: border-box;
            background: rgba(10, 14, 23, 0.85);
            color: var(--text-light);
            border: 1px solid rgba(78, 168, 222, 0.3);
            border-radius: 8px;
            padding: 10px 12px;
            font-size: 0.92rem;
            font-family: inherit;
            outline: none;
            transition: var(--transition);
        }

        .field-input:focus,
        .field-select:focus,
        .field-textarea:focus {
            border-color: var(--text-muted);
            box-shadow: 0 0 8px rgba(78, 168, 222, 0.3);
        }

        .field-textarea {
            min-height: 92px;
            resize: vertical;
            line-height: 1.5;
        }

        .btn-primary {
            padding: 10px 16px;
            background: var(--text-muted);
            color: var(--bg-dark);
            border: none;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            transition: var(--transition);
        }

        .btn-primary:hover {
            filter: brightness(1.1);
            box-shadow: 0 0 12px rgba(78, 168, 222, 0.45);
        }

        .btn-secondary {
            padding: 8px 12px;
            background: rgba(255, 255, 255, 0.06);
            color: var(--text-light);
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 8px;
            font-size: 0.84rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
        }

        .btn-secondary:hover {
            border-color: var(--text-muted);
            background: rgba(78, 168, 222, 0.14);
        }

        /* Cartes du flux */
        .post-meta-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
            flex-wrap: wrap;
        }

        .cat-badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 999px;
            font-size: 0.76rem;
            font-weight: 700;
        }

        .cat-message { background: rgba(255, 77, 109, 0.18); color: #ff758f; }
        .cat-musique { background: rgba(78, 168, 222, 0.18); color: #72efdd; }
        .cat-video { background: rgba(238, 155, 0, 0.18); color: #ffd166; }
        .cat-explication { background: rgba(82, 183, 136, 0.18); color: #80ed99; }

        .post-date {
            font-size: 0.78rem;
            color: rgba(244, 246, 249, 0.5);
        }

        .post-body {
            line-height: 1.6;
            color: rgba(244, 246, 249, 0.92);
            white-space: pre-line;
            margin: 8px 0 0 0;
        }

        /* Intégrations médias */
        .media-embed-box {
            margin-top: 14px;
            border-radius: 10px;
            overflow: hidden;
            background: rgba(10, 14, 23, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .youtube-wrapper {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
        }

        .youtube-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        .media-embed-box audio,
        .media-embed-box video {
            width: 100%;
            display: block;
        }

        .external-media-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 12px;
            padding: 8px 14px;
            background: rgba(78, 168, 222, 0.14);
            color: var(--text-muted);
            text-decoration: none;
            border-radius: 8px;
            font-size: 0.88rem;
            font-weight: 600;
            border: 1px solid rgba(78, 168, 222, 0.3);
            transition: var(--transition);
        }

        .external-media-link:hover {
            background: rgba(78, 168, 222, 0.25);
        }

        .post-actions-footer {
            display: flex;
            justify-content: flex-end;
            margin-top: 12px;
        }

        .btn-delete-post {
            background: transparent;
            border: none;
            color: rgba(244, 246, 249, 0.4);
            font-size: 0.78rem;
            cursor: pointer;
            padding: 4px 6px;
        }

        .btn-delete-post:hover {
            color: var(--love-color);
        }
    </style>
</head>
<body>

    <main class="app-container">
        <!-- Navigation supérieure -->
        <div class="top-nav-row">
            <a href="index.html" class="calendar-day-link">← Retour au Hub</a>
            <button type="button" id="btn-export-json" class="btn-secondary" title="Télécharger ou copier data-divers.json">💾 Exporter JSON</button>
        </div>

        <header class="app-header">
            <h1 id="main-title">Divers &amp; Partages</h1>
            <p class="subtitle-muted">Messages pour Sandra, Musique, Vidéos &amp; Explications</p>
        </header>

        <!-- Bloc de création rapide -->
        <section class="composer-card" aria-label="Ajouter un partage">
            <div class="composer-header" id="toggle-composer">
                <h3>✍️ Ajouter un message, une musique, une vidéo ou une explication</h3>
                <span id="composer-arrow" style="color: var(--activity-color); font-weight: bold;">▼</span>
            </div>

            <form id="post-form" class="composer-form">
                <div class="form-row">
                    <select id="post-category" class="field-select" style="flex: 1; min-width: 170px;" aria-label="Catégorie">
                        <option value="message">💌 Message pour Sandra</option>
                        <option value="musique">🎵 Musique (432 Hz / Morceau)</option>
                        <option value="video">🎬 Vidéo</option>
                        <option value="explication">📖 Explication / Note</option>
                    </select>
                    <input type="text" id="post-author" class="field-input" style="flex: 1; min-width: 150px;" value="Mickael" placeholder="Auteur" aria-label="Auteur">
                </div>

                <input type="text" id="post-title" class="field-input" placeholder="Titre du message, du morceau ou de la vidéo..." required>

                <input type="url" id="post-media-url" class="field-input" placeholder="Lien optionnel (YouTube, fichier .mp3, .mp4, Suno, etc.)">

                <textarea id="post-content" class="field-textarea" placeholder="Écris ton message, les paroles, le contexte du morceau ou ton explication ici..." required></textarea>

                <div class="form-row" style="justify-content: space-between; align-items: center;">
                    <span id="save-feedback" style="font-size: 0.82rem; color: var(--project-color);"></span>
                    <button type="submit" class="btn-primary">Publier sur la page</button>
                </div>
            </form>
        </section>

        <!-- Barre de filtres par thème -->
        <nav class="filter-bar" aria-label="Filtrer les publications">
            <button type="button" class="filter-btn active" data-filter="all">Tout afficher</button>
            <button type="button" class="filter-btn" data-filter="message">💌 Messages</button>
            <button type="button" class="filter-btn" data-filter="musique">🎵 Musique</button>
            <button type="button" class="filter-btn" data-filter="video">🎬 Vidéos</button>
            <button type="button" class="filter-btn" data-filter="explication">📖 Explications</button>
        </nav>

        <!-- Flux des publications -->
        <section id="posts-feed" class="horoscope-grid" aria-live="polite"></section>

        <footer class="app-footer">
            <p>AstroHub — Espace libre partagé • Mickael &amp; Sandra</p>
        </footer>
    </main>

    <script>
        const STORAGE_KEY = "astrohub_divers_posts_v1";

        const DEFAULT_POSTS = [
            {
                id: "init-1",
                category: "message",
                author: "Mickael",
                title: "Bienvenue dans notre espace libre",
                date: "2026-11-22",
                content: "J'ai créé cette page pour pouvoir te déposer librement des messages, des morceaux de musique, des vidéos et des explications sur nos projets ou sur le ciel du moment.",
                mediaUrl: ""
            },
            {
                id: "init-2",
                category: "explication",
                author: "Mickael",
                title: "Pourquoi combiner Sidéral et Tropical dans AstroHub ?",
                date: "2026-11-22",
                content: "Le repère Tropical suit les saisons terrestres et notre rythme biologique (ensoleillement, chronobiologie). Le repère Sidéral montre la position réelle des planètes devant les constellations dans la galaxie. Les deux se complètent comme l'Ancre et la Voile.",
                mediaUrl: ""
            }
        ];

        const CATEGORY_META = {
            message: { label: "💌 Message", badgeClass: "cat-message", cardClass: "love" },
            musique: { label: "🎵 Musique", badgeClass: "cat-musique", cardClass: "projects" },
            video: { label: "🎬 Vidéo", badgeClass: "cat-video", cardClass: "activities" },
            explication: { label: "📖 Explication", badgeClass: "cat-explication", cardClass: "projects" }
        };

        let allPosts = [];
        let activeFilter = "all";

        function extractYouTubeId(url) {
            if (!url) return null;
            const match = url.match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([a-zA-Z0-9_-]{11})/);
            return match ? match[1] : null;
        }

        function buildMediaHTML(url) {
            if (!url) return "";
            const cleanUrl = url.trim();
            const ytId = extractYouTubeId(cleanUrl);

            if (ytId) {
                return `
                    <div class="media-embed-box">
                        <div class="youtube-wrapper">
                            <iframe src="https://www.youtube-nocookie.com/embed/${ytId}" title="Lecteur vidéo YouTube" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
                        </div>
                    </div>
                `;
            }

            if (/\.(mp3|wav|ogg|m4a)(\?.*)?$/i.test(cleanUrl)) {
                return `
                    <div class="media-embed-box" style="padding: 10px;">
                        <audio controls preload="none" src="${cleanUrl}"></audio>
                    </div>
                `;
            }

            if (/\.(mp4|webm)(\?.*)?$/i.test(cleanUrl)) {
                return `
                    <div class="media-embed-box">
                        <video controls preload="metadata" src="${cleanUrl}"></video>
                    </div>
                `;
            }

            return `<a href="${cleanUrl}" target="_blank" rel="noopener noreferrer" class="external-media-link">🔗 Ouvrir le lien média ↗</a>`;
        }

        function escapeHTML(str) {
            const div = document.createElement("div");
            div.textContent = str;
            return div.innerHTML;
        }

        function renderPosts() {
            const feed = document.getElementById("posts-feed");
            const filtered = activeFilter === "all"
                ? allPosts
                : allPosts.filter(p => p.category === activeFilter);

            if (filtered.length === 0) {
                feed.innerHTML = `<article class="card"><p style="text-align:center; color:rgba(244,246,249,0.6);">Aucun élément dans cette catégorie pour le moment.</p></article>`;
                return;
            }

            feed.innerHTML = filtered.map(post => {
                const meta = CATEGORY_META[post.category] || CATEGORY_META.message;
                const dateDisplay = new Date(post.date + "T12:00:00").toLocaleDateString("fr-FR", {
                    day: "numeric", month: "long", year: "numeric"
                });

                return `
                    <article class="card ${meta.cardClass}">
                        <div class="post-meta-top">
                            <span class="cat-badge ${meta.badgeClass}">${meta.label}</span>
                            <span class="post-date">Par ${escapeHTML(post.author || "Mickael")} • ${dateDisplay}</span>
                        </div>
                        <h3>${escapeHTML(post.title)}</h3>
                        <p class="post-body">${escapeHTML(post.content)}</p>
                        ${buildMediaHTML(post.mediaUrl)}
                        ${post.isLocal ? `
                            <div class="post-actions-footer">
                                <button type="button" class="btn-delete-post" data-delete-id="${post.id}">Supprimer cet ajout local</button>
                            </div>
                        ` : ""}
                    </article>
                `;
            }).join("");

            document.querySelectorAll("[data-delete-id]").forEach(btn => {
                btn.addEventListener("click", () => {
                    const id = btn.dataset.deleteId;
                    const localSaved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]").filter(p => p.id !== id);
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(localSaved));
                    allPosts = allPosts.filter(p => p.id !== id);
                    renderPosts();
                });
            });
        }

        async function loadPosts() {
            let remotePosts = DEFAULT_POSTS;
            try {
                const res = await fetch("./data-divers.json");
                if (res.ok) {
                    const json = await res.json();
                    if (Array.isArray(json.posts)) {
                        remotePosts = json.posts;
                    }
                }
            } catch (err) {
                // Repli sur DEFAULT_POSTS si ouvert hors serveur
            }

            const localPosts = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
            allPosts = [...localPosts, ...remotePosts];
            renderPosts();
        }

        document.addEventListener("DOMContentLoaded", () => {
            loadPosts();

            // Plier / déplier le formulaire
            const toggleBtn = document.getElementById("toggle-composer");
            const form = document.getElementById("post-form");
            const arrow = document.getElementById("composer-arrow");
            toggleBtn.addEventListener("click", () => {
                form.classList.toggle("hidden");
                arrow.textContent = form.classList.contains("hidden") ? "▶" : "▼";
            });

            // Filtres
            document.querySelectorAll(".filter-btn").forEach(btn => {
                btn.addEventListener("click", () => {
                    document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
                    btn.classList.add("active");
                    activeFilter = btn.dataset.filter;
                    renderPosts();
                });
            });

            // Ajout d'un nouveau post
            form.addEventListener("submit", (e) => {
                e.preventDefault();
                const category = document.getElementById("post-category").value;
                const author = document.getElementById("post-author").value.trim() || "Mickael";
                const title = document.getElementById("post-title").value.trim();
                const mediaUrl = document.getElementById("post-media-url").value.trim();
                const content = document.getElementById("post-content").value.trim();

                const today = new Date().toISOString().split("T")[0];
                const newPost = {
                    id: "local-" + Date.now(),
                    category,
                    author,
                    title,
                    date: today,
                    content,
                    mediaUrl,
                    isLocal: true
                };

                const localSaved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
                localSaved.unshift(newPost);
                localStorage.setItem(STORAGE_KEY, JSON.stringify(localSaved));

                allPosts.unshift(newPost);
                renderPosts();

                form.reset();
                document.getElementById("post-author").value = author;
                const fb = document.getElementById("save-feedback");
                fb.textContent = "Ajouté ! Utilise « Exporter JSON » en haut pour le publier sur GitHub.";
                setTimeout(() => { fb.textContent = ""; }, 5000);
            });

            // Export JSON pour mise à jour de data-divers.json
            document.getElementById("btn-export-json").addEventListener("click", () => {
                const cleanPosts = allPosts.map(({ isLocal, ...rest }) => rest);
                const payload = JSON.stringify({ posts: cleanPosts }, null, 2);
                const blob = new Blob([payload], { type: "application/json" });
                const url = URL.createObjectURL(blob);
                const a = document.createElement("a");
                a.href = url;
                a.download = "data-divers.json";
                a.click();
                URL.revokeObjectURL(url);
            });
        });
    </script>
</body>
</html>
